name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: nova-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-and-smoke:
    name: Quality checks and production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check project
        run: pnpm run check

      # The deployed-handler test imports the server bundle from dist/.
      - name: Build production artifacts
        run: pnpm run build

      - name: Run test suite
        run: pnpm test

      - name: Verify production health endpoint
        shell: bash
        run: |
          PORT=4176 node dist/index.js > /tmp/nova-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:4176/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nova-server.log
          exit 1
