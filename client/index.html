<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121514" />
    <meta name="description" content="Nova is your personal cloud computer - files, chats, model choices, and agent tasks in one private space that works 24/7." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/favicon-dark-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nova - Your personal cloud computer</title>
    <script>
      // Boot guard. Two jobs, both about never showing a blank page:
      // 1) Apply the stored theme before first paint so a dark-theme user does
      //    not get a white flash while the bundle loads.
      // 2) After a deploy a cached index.html can reference a hashed bundle that
      //    no longer exists. The failed load leaves #root empty (white screen),
      //    so reload once to fetch fresh HTML - and if that is not possible or
      //    did not help, show the boot screen's error state instead of staying
      //    blank with no way out.
      (function () {
        var KEY = "nova_boot_reload";
        var DARK = { midnight: 1, deepsea: 1, pine: 1, nebula: 1, ember: 1 };
        var LIGHT = { daylight: 1, ocean: 1, meadow: 1, blossom: 1, sandstone: 1 };

        // Keep in sync with ThemeContext: unknown values fall back to the
        // default light theme, so we simply leave the document untouched.
        var stored = null;
        try {
          stored = localStorage.getItem("nova.theme") || localStorage.getItem("theme");
        } catch (e) {}
        var id = stored === "dark" ? "midnight" : stored === "light" ? "daylight" : stored;
        if (id && (DARK[id] || LIGHT[id])) {
          var el = document.documentElement;
          el.setAttribute("data-theme", id);
          el.classList.toggle("dark", !!DARK[id]);
          el.style.colorScheme = DARK[id] ? "dark" : "light";
        }

        function recoveryAttempted() {
          if (/[?&]nr=/.test(location.search)) return true;
          try {
            if (sessionStorage.getItem(KEY)) return true;
          } catch (e) {}
          return false;
        }

        var failedUrl = null;
        var probing = false;

        function fail(reason) {
          if (document.documentElement.getAttribute("data-boot") === "failed") return;
          var title = document.getElementById("boot-title");
          var sub = document.getElementById("boot-sub");
          var retry = document.getElementById("boot-retry");
          if (!title || !sub || !retry) return;
          document.documentElement.setAttribute("data-boot", "failed");
          title.textContent = "Nova could not start";
          var detail = "";
          try {
            var ua = navigator.userAgentData;
            var brand = ua && ua.brands ? ua.brands.map(function (b) { return b.brand + " " + b.version; }).join(", ") : "";
            var parts = [brand || navigator.userAgent];
            if (ua && ua.platform) parts.push(ua.platform);
            detail = " [" + parts.join(" | ") + "]";
          } catch (e) {}
          sub.textContent = (reason ? reason + " " : "") + "The app failed to load. Check your connection, disable any script blockers for this site, then try again." + detail;
          retry.hidden = false;

          // If a specific resource failed, probe it directly and, when the
          // network can actually reach it, retry the boot with a cache-busted
          // copy of the module. This distinguishes a blocked/failed request
          // from an HTTP error and can recover a poisoned cache entry without
          // a manual hard refresh. Runs at most once per page.
          var match = /Could not load (\S+)\./.exec(reason || "");
          if (!match || probing) return;
          probing = true;
          failedUrl = match[1];
          var note = document.createElement("p");
          note.id = "boot-probe";
          note.style.margin = "10px 0 0";
          note.style.fontSize = "13px";
          note.style.lineHeight = "1.5";
          sub.parentNode.insertBefore(note, retry);
          var say = function (text) { note.textContent = "Probe: " + text; };
          say("re-testing " + failedUrl + "\u2026");
          var root = document.getElementById("root");
          var booted = function () { return root && root.hasChildNodes(); };
          window
            .fetch(failedUrl, { cache: "no-store" })
            .then(function (res) {
              if (res.body && res.body.cancel) {
                try { res.body.cancel(); } catch (e) {}
              }
              if (!res.ok) {
                say("HTTP " + res.status + " " + res.statusText + " - the server is refusing this file.");
                return null;
              }
              if (booted()) return null; // module ran after all; boot watcher will hide the screen
              say("HTTP 200 - reachable. Retrying with a fresh copy\u2026");
              var s = document.createElement("script");
              s.type = "module";
              s.setAttribute("data-boot-retry", "1");
              s.src = failedUrl + (failedUrl.indexOf("?") === -1 ? "?" : "&") + "bootretry=" + Date.now();
              var freshTimer = setTimeout(function () {
                if (booted()) return;
                say("The fresh copy also failed to load - a blocker or network filter is likely.");
              }, 6000);
              s.addEventListener("error", function () { clearTimeout(freshTimer); say("The fresh copy also failed to load - a blocker or network filter is likely."); });
              s.addEventListener("load", function () { clearTimeout(freshTimer); });
              document.body.appendChild(s);
              return null;
            })
            .catch(function (err) {
              say("request failed (" + ((err && err.name) || "error") + ") - a blocker, VPN, proxy, or DNS filter is preventing the download.");
            });
        }
        window.__novaFail = fail;

        window.addEventListener("error", function (event) {
          var target = event.target;
          // Only module scripts and stylesheets matter for boot; ignore
          // favicon/analytics failures, the probe's own retry script, and any
          // failures after the app is up so they cannot trigger a reload.
          if (!target) return;
          if (target.hasAttribute && target.hasAttribute("data-boot-retry")) return;
          var isScript = target.tagName === "SCRIPT" && target.type === "module";
          var isSheet = target.tagName === "LINK" && target.rel === "stylesheet";
          if (!isScript && !isSheet) return;
          var root = document.getElementById("root");
          var failedSrc = target.src || target.href || "unknown";
          if (isSheet || (isScript && root && !root.hasChildNodes())) {
            if (recoveryAttempted()) {
              fail("Could not load " + failedSrc + ".");
              return;
            }
          try {
            sessionStorage.setItem(KEY, "1");
          } catch (e) {}
            var url = new URL(location.href);
            url.searchParams.set("nr", "1");
            location.replace(url.href);
          }
        }, true);

        // Uncaught exceptions from module evaluation surface here (the capture
        // listener above only sees resource failures). Report the crash only
        // after the one-shot recovery has been used, so a transient first-load
        // failure still gets the reload attempt.
        window.addEventListener("error", function (event) {
          if (!event.target || (event.target !== window && event.target !== document)) return;
          if (!recoveryAttempted()) return;
          var root = document.getElementById("root");
          if (root && !root.hasChildNodes()) {
            fail("Startup error: " + (event.message || "unknown script error") + ".");
          }
        });

        window.addEventListener("unhandledrejection", function (event) {
          if (document.documentElement.getAttribute("data-boot") === "failed") return;
          if (document.getElementById("root") && document.getElementById("root").hasChildNodes()) return;
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && !root.hasChildNodes()) fail("Startup error: " + (event.reason && (event.reason.stack || event.reason.message || String(event.reason)) || "unknown promise rejection") + ".");
          }, 0);
        });

        setTimeout(function () {
          if (document.readyState !== "complete") return;
          var root = document.getElementById("root");
          var stylesheets = document.querySelectorAll('link[rel="stylesheet"]');
          var stylesLoaded = Array.prototype.some.call(stylesheets, function (link) { return link.sheet; });
          if (root && !root.hasChildNodes()) {
            var main = document.querySelector('script[type="module"][src]');
            fail("The app bundle did not execute" + (main ? " (" + main.getAttribute("src") + ")." : "."));
          } else if (root && root.hasChildNodes() && stylesheets.length > 0 && !stylesLoaded) {
            fail("The stylesheet did not load.");
          }
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot screen: painted by the HTML parser before any JavaScript runs, so
         there is always something on screen. Hidden as soon as React renders. -->
    <div id="boot" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--background,#faf7f2);color:var(--foreground,#241f17);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
      <div>
        <p id="boot-title" style="margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em;">Starting Nova&hellip;</p>
        <p id="boot-sub" style="margin:8px 0 0;font-size:14px;line-height:1.5;opacity:0.7;">Loading your workspace.</p>
        <button id="boot-retry" type="button" hidden style="margin-top:18px;padding:10px 20px;border:0;border-radius:999px;background:var(--primary,#e2662a);color:var(--primary-foreground,#fff);font:inherit;font-size:14px;font-weight:600;cursor:pointer;">Reload Nova</button>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#faf7f2;color:#241f17;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
        <div>
          <p style="margin:0;font-size:18px;font-weight:700;">Nova needs JavaScript</p>
          <p style="margin:8px 0 0;font-size:14px;line-height:1.5;">Enable JavaScript for this site, then reload the page.</p>
        </div>
      </div>
    </noscript>
    <script>
      // Hide the boot screen once React has rendered into #root, and wire the
      // retry button to a recovery that is allowed to run again.
      (function () {
        var boot = document.getElementById("boot");
        var retry = document.getElementById("boot-retry");
        if (retry) {
          retry.addEventListener("click", function () {
            try {
              sessionStorage.removeItem("nova_boot_reload");
            } catch (e) {}
            var url = new URL(location.href);
            url.searchParams.delete("nr");
            location.replace(url.href);
          });
        }
        var timer = setInterval(function () {
          if (document.documentElement.getAttribute("data-boot") === "failed") {
            clearInterval(timer);
            return;
          }
          var root = document.getElementById("root");
          if (root && root.hasChildNodes()) {
            clearInterval(timer);
            boot.style.display = "none";
          }
        }, 50);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
