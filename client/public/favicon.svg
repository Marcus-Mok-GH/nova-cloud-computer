<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nova favicon: the four-point nova starburst, glowing over a deep
       space-violet tile. Derived from the in-app NovaMark so the browser
       tab matches the product's brand mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f3d"/>
      <stop offset="0.55" stop-color="#262050"/>
      <stop offset="1" stop-color="#3d2570"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.52">
      <stop offset="0" stop-color="#ffc96b" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ffc96b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffc96b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.55" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <circle cx="32" cy="31" r="24" fill="url(#glow)"/>
  <!-- Nova starburst (NovaMark path scaled from the 24px grid) -->
  <path d="M32 5.78 C34.34 19.04 37.72 27.36 45.52 31 C37.72 34.64 34.34 42.96 32 56.22 C29.66 42.96 26.28 34.64 18.48 31 C26.28 27.36 29.66 19.04 32 5.78 Z" fill="url(#star)"/>
  <circle cx="32" cy="31" r="6.2" fill="#fffdf5"/>
  <!-- Small companion sparkle, top right -->
  <path d="M49.5 8.5 C50.1 11.2 51.6 12.9 54.5 13.5 C51.6 14.1 50.1 15.8 49.5 18.5 C48.9 15.8 47.4 14.1 44.5 13.5 C47.4 12.9 48.9 11.2 49.5 8.5 Z" fill="#ffffff" fill-opacity="0.85"/>
</svg>
