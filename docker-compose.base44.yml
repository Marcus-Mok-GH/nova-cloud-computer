# Development stack for the Base44 sandbox.
#
# The app runs from the bind-mounted working tree with `pnpm dev` (tsx watch +
# Vite in middleware mode), so edits are reflected without rebuilding an image.
# Postgres is a local stand-in for Neon; the server migrates the schema at boot
# (`ensureDatabaseSchema` reads drizzle/neon through NOVA_MIGRATIONS_DIR).
services:
  postgres:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    volumes:
      - nova-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    labels:
      base44.project: "Nova"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /workspace
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        CI=true pnpm install --frozen-lockfile --store-dir /pnpm-store
        exec pnpm dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Local Postgres: sslmode=disable keeps the pool plaintext on-loopback.
      - DATABASE_URL=postgres://nova:nova@postgres:5432/nova?sslmode=disable
      - DATABASE_URL_UNPOOLED=postgres://nova:nova@postgres:5432/nova?sslmode=disable
      # Public origin of this sandbox, used for absolute links/webhooks.
      - NOVA_PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Sandbox-only flag, passed through as-is (never hardcoded).
      - BASE44_PREVIEW_MODE
    env_file:
      # Platform-managed secrets (Neon Auth, AI gateway, E2B). Listed last so a
      # real value always wins over the local defaults above.
      - /run/base44/app.env
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - nova-node-modules:/workspace/node_modules
      - nova-pnpm-store:/pnpm-store
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  nova-postgres:
  nova-node-modules:
  nova-pnpm-store:
